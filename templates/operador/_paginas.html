{% if page_obj.has_other_pages %}<div class="fila entre small noprint">
  <span class="muted">Página {{ page_obj.number }} de {{ page_obj.paginator.num_pages }} · {{ page_obj.paginator.count }} en total</span>
  <span class="fila">{% if page_obj.has_previous %}<a class="btn sec chico" href="?{% for k, v in request.GET.items %}{% if k != 'page' %}{{ k }}={{ v|urlencode }}&{% endif %}{% endfor %}page={{ page_obj.previous_page_number }}">‹ Anterior</a>{% endif %}
  {% if page_obj.has_next %}<a class="btn sec chico" href="?{% for k, v in request.GET.items %}{% if k != 'page' %}{{ k }}={{ v|urlencode }}&{% endif %}{% endfor %}page={{ page_obj.next_page_number }}">Siguiente ›</a>{% endif %}</span>
</div>{% endif %}
